apiVersion: dalgo.io/access/v1
kind: AccessPolicy
metadata:
  name: demo-project-1
default: deny
ruleSets:
  admin:
    - path: /**
      rules:
        - id: admin-full-access
          effect: allow
          operations: [readwrite]
    - opaqueQuery: true
      rules:
        - id: admin-native-sql
          effect: allow
          operations: [query]
  support:
    - path: /Customer
      rules:
        - id: customers-support
          effect: allow
          operations: [query]
          where:
            op: "=="
            left: { field: Country }
            right: { value: Canada }
          fields:
            - CustomerId
            - FirstName
            - LastName
            - Company
            - Address
            - City
            - State
            - Country
            - PostalCode
            - Phone
            - Fax
            - SupportRepId
    - path: /Invoice
      rules:
        - id: invoices-support
          effect: allow
          operations: [query]
          where:
            op: "=="
            left: { field: BillingCountry }
            right: { value: Canada }
          fields:
            - InvoiceId
            - CustomerId
            - InvoiceDate
            - BillingAddress
            - BillingCity
            - BillingState
            - BillingCountry
            - BillingPostalCode
            - Total
    - path: /support-notes
      rules:
        - id: support-notes-support
          effect: allow
          operations: [query]
          where:
            op: "=="
            left: { field: Country }
            right: { value: Canada }
          fields:
            - CustomerId
            - Country
            - Author
            - CreatedAt
            - Note
bindings:
  roles:
    admin: [admin]
    support: [support]
