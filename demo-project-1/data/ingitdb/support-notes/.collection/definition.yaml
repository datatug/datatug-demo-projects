record_file:
    name: '{key}.yaml'
    format: yaml
    type: map[string]any
columns:
    CustomerId:
        type: int
        required: true
    Author:
        type: string
        required: true
    CreatedAt:
        type: string
        required: true
    Note:
        type: string
        required: true
columns_order:
    - CustomerId
    - Author
    - CreatedAt
    - Note
